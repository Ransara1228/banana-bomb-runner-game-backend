# AI-assisted: Claude (Anthropic), 2026-11-04. Runs the Spock tests on every pull request.
name: CI
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Spock tests
        run: mvn -B test
