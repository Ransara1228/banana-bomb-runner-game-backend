# Used for: first version of this file. Change it, test it and make sure you understand it before submitting.
server:
  port: 8080
  error:
    include-message: always

spring:
  # Java 21: virtual threads for web requests and @Async tasks (the OTP email)
  threads:
    virtual:
      enabled: true

  # MySQL / MariaDB in XAMPP (user root, no password). The database is made if it is missing.
  datasource:
    url: jdbc:mysql://localhost:3306/banana_bomb_runner_db?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  # Mail login comes from environment variables or from a .env file next to pom.xml.
  # .env is in .gitignore, so the SMTP key never goes to GitHub. See .env.example.
  config:
    import: "optional:file:./.env[.properties]"

  # Email (Brevo SMTP by default; Gmail works too with an App Password)
  mail:
    host: "${MAIL_HOST:smtp-relay.brevo.com}"
    port: ${MAIL_PORT:587}
    username: "${MAIL_USER:}"
    password: "${MAIL_PASS:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Our own settings
app:
  jwt:
    # at least 32 characters. Put the real one in the JWT_SECRET environment variable.
    secret: "${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}"
  cookie:
    secure: false          # true when the site runs on HTTPS
  banana:
    url: https://marcconrad.com/uob/banana/api.php?out=json
    timeout-seconds: 5
  mail:
    from: "${MAIL_FROM:${spring.mail.username:}}"   # a sender address you verified in Brevo
  otp:
    log-code: true         # shows the OTP code in the console while testing. Set to false for the final version.
